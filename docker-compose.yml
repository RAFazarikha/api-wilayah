# Coolify: set the domain in the UI; Traefik routes to the container port. No host port is published.
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Set to the Traefik container's IP or a narrow subnet so the real client IP is read from
      # X-Forwarded-For. Do not trust the whole coolify network if you can avoid it: any other container
      # on a trusted CIDR can forge X-Forwarded-For and dodge the rate limit.
      # Empty = XFF is never trusted, so behind Traefik all clients share ONE rate-limit bucket (a warning is logged).
      # Behind a CDN the address read is the CDN edge, not the visitor; the CDN's ranges would have to be trusted instead.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ADDR: ${METRICS_ADDR:-127.0.0.1:9090}
    expose:
      - "8080"
    # Plain compose limits (honoured by `docker compose`, which Coolify uses); Swarm-only deploy.resources is avoided.
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
