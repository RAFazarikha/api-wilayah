name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to major tags, not commit SHAs (SHAs could not be verified offline).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2 && staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0 && govulncheck ./...
      # Includes TestCountsAndNoOrphans: the committed artifact must satisfy the 38/514/7285/83762 counts.
      - run: go test -race ./...
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t api-wilayah:ci .
